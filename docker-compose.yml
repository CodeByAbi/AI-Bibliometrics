# AI-Bibliometrics — local/dev stack (Phase 0).
# Services: backend (FastAPI, built from ./docker/backend.Dockerfile) + ollama (local model serving).
# No Postgres service: the live prototype DB is external (see DB_URL in .env).
name: ai-bibliometrics

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  ollama:
    # Tag pinned at Task 3 (Ollama setup) once the model-serving version is validated.
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:

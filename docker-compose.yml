# AI-Bibliometrics â€” local/dev stack.
# Service: backend (FastAPI, built from ./docker/backend.Dockerfile).
# No ollama service on purpose: the model server is the operator's own native
# Ollama install on the host, so Compose must not pull/duplicate a ~4 GB image.
# The backend reaches it through the Docker host gateway instead.
# No Postgres service: the live prototype DB is external (see DB_URL in .env).
name: ai-bibliometrics

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      # Native host Ollama (default port 11434) reached from inside the
      # container. `host.docker.internal` is built into Docker Desktop; on
      # Linux the extra_hosts mapping below resolves it via host-gateway.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      # Must stay writable by the non-root `app` user in the image, or the first
      # SentenceTransformer load fails and silently degrades to Ollama embedding.
      HF_HOME: /home/app/.cache/huggingface
      # Thread budget for torch encode (bge-m3 query embedding). The image
      # defaults to 1; on this 4-CPU host single-thread encode measured
      # 617 ms warm (up to 19.8 s under contention), dominating VectorRoute.
      # 4 matches the host; lower to 2 if Ollama synthesis contends on CPU.
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
    # Persist the HuggingFace cache across `up --build` / recreate.
    #
    # Measured on this deployment: bge-m3 is ~2.2 GB, and because HF_HOME lived
    # only in the container filesystem every recreate discarded it and the next
    # VectorRoute request re-downloaded and re-loaded the model —
    # embedding_ms = 167,679 ms cold-cache vs 13,450 ms warm-cache vs 0.02 ms
    # once the process is warm. The background pre-warm in the lifespan hides
    # that cost from startup, but a request arriving mid-prewarm still blocks on
    # the same lock, so the download was being charged to a user request.
    # With the volume the first `up` still downloads once; every later recreate
    # starts from the warm-cache figure.
    volumes:
      - hf-cache:/home/app/.cache/huggingface
    # No-op on Docker Desktop, required on Linux engines where the magic DNS
    # name is absent.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Override the Dockerfile CMD so proxy trust stays a deploy-time decision
    # (the same image runs locally with no proxy and behind Caddy/tunnel later).
    #
    # --proxy-headers makes uvicorn populate request.client.host from
    # X-Forwarded-For / X-Real-Ip, which is what RateLimitingMiddleware keys on.
    # Without it, every request arrives with client.host = the proxy's IP and the
    # whole site collapses into ONE shared rate-limit bucket (site-wide 429s).
    #
    # !! SECURITY: never set TRUSTED_PROXY_IPS to `*`. uvicorn would then honour a
    # client-supplied X-Forwarded-For, so anyone could spoof a fresh IP per
    # request and bypass rate limiting entirely. List only the real proxy
    # IP/CIDR. Default 127.0.0.1 is correct when nothing proxies the app.
    command:
      - uvicorn
      - backend.app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=${TRUSTED_PROXY_IPS:-127.0.0.1}
    ports:
      - "8000:8000"
    # No `depends_on` gate any more: the model server is external to Compose,
    # so there is no Compose health condition to wait on. Every Ollama call
    # site already degrades on failure (embedding fallback, deterministic
    # synthesis fallback, `llm: down` in /api/v1/health).
    restart: unless-stopped
    # Cap the blast radius of a runaway request. The values are deliberately
    # modest: bge-m3 + Qwen2.5-Coder on CPU is memory-hungry, and an unbounded
    # container can starve the host and take Ollama down with it. Raise only with
    # a measurement, not a guess.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          memory: 1G
    # Defence in depth on top of the image already running as uid 10001:
    # drop every capability (nothing here needs any) and forbid setuid
    # binaries from regaining privilege.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # rootless Docker Desktop note: on Linux, `user:` here would be honoured but
    # the image already sets USER app; setting it again to a different uid would
    # break the HF_HOME ownership established in the Dockerfile.

# Named volumes. Kept at project level so `docker compose down` (without -v)
# does not throw away the model cache.
volumes:
  hf-cache:

[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    e2e_live: live-DB E2E benchmark suite (skipped when DB_URL or Ollama unavailable)
    session_integration: session-persistence acceptance tests. REQUIRE a configured DB_URL_SESSION (role app_session) and a migrated `app` schema; without one they SKIP with an actionable reason rather than passing, because a skipped session test proves nothing. Run with `pytest -m session_integration -v` to prove the group actually executed.
